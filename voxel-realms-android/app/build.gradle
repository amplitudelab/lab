plugins { id 'com.android.application' }
def build = Integer.parseInt(System.getenv('GITHUB_RUN_NUMBER') ?: '1')
android {
    namespace 'com.symbiozyy.voxelrealms'
    compileSdk 34
    defaultConfig {
        applicationId 'com.symbiozyy.voxelrealms'
        minSdk 26
        targetSdk 34
        // cada build do GitHub Actions sobe o número, então o APK novo sempre instala por cima do antigo
        versionCode = build
        versionName = '1.0.' + build
    }
    signingConfigs {
        release {
            storeFile file('../voxel-realms.keystore')
            storePassword 'voxelrealms'
            keyAlias 'voxelrealms'
            keyPassword 'voxelrealms'
        }
    }
    buildTypes { release { signingConfig signingConfigs.release; minifyEnabled false } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
