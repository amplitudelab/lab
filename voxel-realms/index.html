<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="screen-orientation" content="landscape"><meta name="mobile-web-app-capable" content="yes"><title>VOXEL REALMS V10</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&display=swap" rel="stylesheet">
<style>
/* ===== VOXEL REALMS V8 — UPDATED · layout horizontal ===== */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--g:#d9a948;--g2:#f3d27a;--fn:'Cinzel',Georgia,serif;
--js:clamp(104px,30vh,150px);--bb:clamp(70px,21vh,96px);--mm:clamp(92px,27vh,124px);--sl:clamp(36px,min(11vh,6vw),54px)}
html,body{margin:0;height:100%;overflow:hidden;background:#cfe3e8;touch-action:none;user-select:none;-webkit-user-select:none;font-family:Georgia,serif;color:#f4ead2}
canvas{display:block;width:100%;height:100%}
/* pós-efeitos (camadas de composição baratas) */
#post{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:1}
#sunw{position:absolute;left:0;top:0;width:0;height:0;will-change:transform,opacity;opacity:0}
#rays{position:absolute;left:-90vmax;top:-90vmax;width:180vmax;height:180vmax;background:repeating-conic-gradient(rgba(255,238,190,.15) 0deg 2.2deg,transparent 2.2deg 7.5deg);-webkit-mask-image:radial-gradient(circle,#000 0,rgba(0,0,0,.45) 16%,transparent 46%);mask-image:radial-gradient(circle,#000 0,rgba(0,0,0,.45) 16%,transparent 46%);animation:rr 120s linear infinite;will-change:transform}
#flare{position:absolute;left:-24vmin;top:-24vmin;width:48vmin;height:48vmin;border-radius:50%;background:radial-gradient(circle,rgba(255,252,230,.8) 0,rgba(255,226,150,.32) 22%,transparent 68%)}
@keyframes rr{to{transform:rotate(360deg)}}
#vig{position:absolute;inset:0;background:radial-gradient(ellipse 75% 70% at 50% 46%,transparent 58%,rgba(40,10,40,.45) 100%),linear-gradient(180deg,rgba(255,170,120,.10),transparent 30%)}
#ui{position:fixed;pointer-events:none;z-index:3;inset:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
#ui>*{position:absolute}
/* painéis ornamentados */
.wd{background:linear-gradient(rgba(44,24,38,.92),rgba(14,8,14,.9));border:2px solid var(--g);border-radius:4px;box-shadow:inset 0 0 0 1px #000,inset 0 0 0 3px rgba(217,169,72,.18),0 4px 12px rgba(0,0,0,.6);outline:1px solid rgba(217,169,72,.35);outline-offset:2px}
.ttl{font:700 14px var(--fn);color:var(--g2);letter-spacing:.5px;text-shadow:0 1px 2px #000}
/* botões redondos */
.rb{pointer-events:auto;border-radius:50%;border:3px solid #c99a3e;background:radial-gradient(circle at 50% 32%,#45331f,#120c08 72%);box-shadow:inset 0 0 0 3px #3a2a14,inset 0 0 14px #000,0 0 0 2px rgba(0,0,0,.6),0 5px 12px rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;touch-action:none;position:absolute}
.rb:before{content:'';position:absolute;inset:0;border-radius:50%;background:conic-gradient(rgba(0,0,0,.72) calc(var(--c,0)*360deg),transparent 0);z-index:1}
.rb:active{transform:scale(.92)}
.rb span{position:relative;width:62%;height:62%;display:flex}.rb svg{width:100%;height:100%;filter:drop-shadow(0 2px 2px #000)}
/* jogador */
#pl{left:8px;top:8px;width:min(300px,31vw);height:66px;padding:5px 8px 5px 70px}
#pf{position:absolute;left:5px;top:4px;width:56px;height:56px;border:2px solid var(--g);image-rendering:pixelated;background:#3a6aa8}
#lv{font:700 15px var(--fn);color:var(--g2);text-shadow:0 1px 2px #000}#gd{float:right;font:700 12px Georgia;color:#fff;margin-top:2px}
.bar{height:15px;background:#240d0d;border:1px solid #000;position:relative;overflow:hidden;margin:2px 0;border-radius:2px}.bar i{display:block;height:100%;transition:width .2s}.bar b{position:absolute;inset:0;text-align:center;font:700 11px/15px Georgia;text-shadow:0 1px 2px #000}
#hpb{height:17px}#hpb b{line-height:17px}
#hpf{background:linear-gradient(#ff6a5a,#c01e1e 55%,#8a1010)}#xpf{background:linear-gradient(#7ab4ff,#2a5fc8 60%,#1a3a8a)}
/* missões */
#qp{left:8px;top:84px;width:min(250px,27vw);padding:4px 8px 6px;pointer-events:auto;max-height:calc(100% - 84px - var(--js) - 40px);overflow-y:auto;scrollbar-width:none}
#qp::-webkit-scrollbar{display:none}
#qh{cursor:pointer;display:flex;align-items:center;gap:6px;padding:2px 0 4px}
#qh i{font-style:normal;width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--g);background:#2a1c10;border-radius:3px;font-size:13px}
.q{border-top:1px solid rgba(217,169,72,.3);padding:5px 0;font-size:10.5px;line-height:1.25;display:grid;grid-template-columns:22px 1fr;gap:6px;color:#e8dcc0}
.q .qi{font-style:normal;font-size:16px;text-align:center;filter:drop-shadow(0 1px 1px #000)}
.q b{display:block;font:700 12px var(--fn);color:#ffcf6a}.q.d b{color:#7df08a}.q.d b:before{content:'✓ '}
.qr{display:flex;align-items:center;gap:6px;margin:3px 0 1px}.qr span{font-size:10px;color:#fff}
.qb{flex:1;height:5px;background:#1c120c;border:1px solid #000}.qb i{display:block;height:100%;background:linear-gradient(#ffd45a,#b8861c)}.q.d .qb i{background:#6fe07a}
.q small{font-size:10px;color:#f3d27a}
.min .q{display:none}
@media(max-height:430px){.q .qd{display:none}}
/* minimapa e região */
#mw{right:8px;top:8px;width:var(--mm);height:var(--mm)}#mc{width:100%;height:100%;border-radius:50%;box-shadow:0 4px 12px rgba(0,0,0,.6)}
#mw span{position:absolute;font:900 11px var(--fn);color:#fff;text-shadow:0 0 3px #000,0 0 2px #000}
#rg{right:8px;top:calc(var(--mm) + 14px);width:calc(var(--mm) + 26px);padding:3px 4px;text-align:center}
#rn{font:700 11.5px var(--fn);color:#fff}#rg small{display:block;font-size:10px;color:#e8dcc0}
/* notificação */
#ts{left:50%;top:8px;width:min(270px,34vw);padding:7px 10px 7px 46px;font-size:11px;transform:translate(-50%,-150%);opacity:0;transition:transform .35s,opacity .4s,top .3s}
#ts.on{transform:translate(-50%,0);opacity:1}
#ts .ck{position:absolute;left:8px;top:50%;margin-top:-15px;width:30px;height:30px;border-radius:50%;background:radial-gradient(#4fd06a,#1f8a3a);border:2px solid #bff5c8;text-align:center;line-height:26px;font-size:16px;font-style:normal;color:#fff}
#ts b{display:block;font:700 13px var(--fn);color:#7df08a}#ts span{color:var(--g2);font-weight:700}
#boss.on~#ts{top:64px}
/* chefe */
#boss{left:50%;top:6px;transform:translateX(-50%);width:min(420px,34vw);display:none;text-align:center}
#boss.on{display:block}
#boss .bt{font:700 14px var(--fn);color:#fff;text-shadow:0 2px 3px #000;display:inline-block;padding:2px 14px;background:linear-gradient(90deg,transparent,rgba(20,8,6,.85) 20%,rgba(20,8,6,.85) 80%,transparent)}
#boss .bar{height:15px;border:2px solid var(--g);box-shadow:0 0 0 1px #000,0 3px 8px #000a;margin-top:2px}
#boss .bar:before,#boss .bar:after{content:'';position:absolute;top:50%;width:10px;height:10px;margin-top:-5px;background:var(--g);transform:rotate(45deg);z-index:1}
#boss .bar:before{left:-6px}#boss .bar:after{right:-6px}
/* hotbar */
#hb{left:50%;bottom:8px;transform:translateX(-50%);display:flex;gap:3px;padding:3px;pointer-events:auto}
.sl{width:var(--sl);height:var(--sl);position:relative;border:2px solid #7a5a30;background:radial-gradient(#2a1d12,#100b07);border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:calc(var(--sl)*.5);transition:transform .12s}
.sl.on{border-color:#ffd34a;box-shadow:0 0 10px #ffd34a,inset 0 0 8px rgba(255,211,74,.55);transform:translateY(-3px)}
.sl em{position:absolute;right:2px;bottom:0;font:700 12px Georgia;font-style:normal;text-shadow:0 1px 2px #000,0 0 2px #000}
/* joystick */
#jb{left:26px;bottom:22px;width:var(--js);height:var(--js);border-radius:50%;border:3px solid var(--g);background:radial-gradient(rgba(30,20,12,.25),rgba(30,20,12,.55));box-shadow:inset 0 0 0 4px rgba(0,0,0,.35),0 4px 10px rgba(0,0,0,.5);pointer-events:auto;touch-action:none}
#jb:after{content:'▲';position:absolute;left:50%;top:6px;transform:translateX(-50%);font-size:11px;color:rgba(243,210,122,.7);text-shadow:0 calc(var(--js) - 30px) 0 rgba(243,210,122,.7)}
#jk{position:absolute;left:50%;top:50%;width:42%;height:42%;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle at 40% 35%,#f0dca0,#9a7a3a 70%,#6a4a20);border:2px solid rgba(255,255,255,.4);box-shadow:0 3px 6px #000a;pointer-events:none}
/* ações */
#atk{right:18px;bottom:18px;width:var(--bb);height:var(--bb)}
#def{right:calc(var(--bb) + 28px);bottom:12px;width:calc(var(--bb)*.7);height:calc(var(--bb)*.7)}
#skl{right:calc(var(--bb) + 22px);bottom:calc(var(--bb)*.78 + 18px);width:calc(var(--bb)*.72);height:calc(var(--bb)*.72)}
#dod{right:24px;bottom:calc(var(--bb) + 28px);width:calc(var(--bb)*.66);height:calc(var(--bb)*.66)}
#fl{inset:0;box-shadow:inset 0 0 90px 20px #f00;opacity:0;transition:opacity .4s}
#bn{left:0;right:0;top:28%;text-align:center;font:900 clamp(26px,7vh,52px) var(--fn);color:#ffd34a;text-shadow:0 3px 0 #6a3a10,0 0 18px #000;opacity:0;transition:opacity .5s}
#dd{inset:0;background:rgba(0,0,0,.65);display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;font:900 30px var(--fn);color:#ff8a7a;pointer-events:auto}
#dd button,#mn button{font:700 18px var(--fn);padding:10px 22px;background:linear-gradient(#5a4028,#2b1d13);color:#ffe08a;border:3px solid var(--g);border-radius:6px;box-shadow:0 4px 10px #000a,inset 0 0 0 1px #000}
.pp,.lb{position:fixed;left:0;top:0;pointer-events:none;font:700 17px Georgia;text-shadow:0 2px 3px #000;white-space:nowrap;display:none;z-index:2}
.lb{font:700 10px var(--fn);text-align:center;color:#fff;background:rgba(12,8,5,.55);padding:1px 6px 2px;border-radius:3px}.lb u{display:block;width:48px;height:4px;background:#400;margin:2px auto 0;border:1px solid #000}.lb s{display:block;height:100%;background:#e33}
#mn{inset:0;background:radial-gradient(ellipse at 50% 38%,rgba(255,150,80,.14),transparent 60%),linear-gradient(rgba(30,10,50,.1),rgba(18,6,28,.72));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;pointer-events:auto;z-index:5;padding:16px}
#mn h1{margin:0;font:900 clamp(34px,11vh,72px) var(--fn);color:#ffd34a;text-shadow:0 4px 0 #6a3a10,0 0 24px #000;text-align:center;letter-spacing:3px}
#mn .sub{font:700 13px var(--fn);color:#f3e2b0;letter-spacing:4px;margin:-4px 0 10px;text-shadow:0 2px 3px #000}
#mn button{width:min(280px,60vw);font-size:18px;padding:9px}
#al{display:none;max-width:min(420px,80vw);max-height:30vh;overflow:auto;font-size:13px;line-height:1.5;padding:6px 10px}
#rot{display:none;position:fixed;inset:0;z-index:99;background:#14100b;color:#ffd34a;align-items:center;justify-content:center;flex-direction:column;text-align:center;font:700 19px/1.6 var(--fn);padding:30px}
#rot i{font-style:normal;font-size:56px;display:block;animation:tl 1.6s ease-in-out infinite}@keyframes tl{0%,30%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
@media(orientation:portrait) and (pointer:coarse){#rot{display:flex}}
/* ===== V9 ===== */
#heat{position:absolute;inset:0;opacity:0;background:radial-gradient(ellipse at 50% 125%,rgba(255,90,20,.38),transparent 62%),radial-gradient(ellipse 80% 70% at 50% 46%,transparent 52%,rgba(120,30,0,.5) 100%)}
#rol{right:calc(var(--bb) + 34px);bottom:calc(var(--bb)*1.55 + 26px);width:calc(var(--bb)*.6);height:calc(var(--bb)*.6)}
#tlk{left:50%;bottom:calc(var(--sl) + 28px);transform:translateX(-50%);display:none;pointer-events:auto;font:700 15px var(--fn);color:#ffe08a;padding:8px 18px;background:linear-gradient(#5a4028,#2b1d13);border:2px solid var(--g);border-radius:22px;box-shadow:0 4px 10px rgba(0,0,0,.6);animation:tp 1.2s ease-in-out infinite;white-space:nowrap}
@keyframes tp{50%{box-shadow:0 0 16px #ffd34a,0 4px 10px rgba(0,0,0,.6)}}
#dlg{left:50%;bottom:14px;transform:translateX(-50%);width:min(660px,76vw);min-height:84px;display:none;pointer-events:auto;padding:11px 18px 12px 80px;z-index:6}
#dlg.on{display:block}
#di{position:absolute;left:12px;top:12px;width:56px;height:56px;border:2px solid var(--g);border-radius:50%;background:radial-gradient(#4a3420,#140d08);font-style:normal;font-size:30px;display:flex;align-items:center;justify-content:center}
#dn{display:block;font:700 15px var(--fn);color:var(--g2);margin-bottom:3px}
#dt{margin:0;font-size:14.5px;line-height:1.4;color:#f4ead2;min-height:40px}
#dlg u{position:absolute;right:12px;bottom:6px;text-decoration:none;color:var(--g2);animation:bk 1s steps(2) infinite}@keyframes bk{50%{opacity:0}}
#lbt,#lbb{left:-60px;right:-60px;height:0;background:#000;transition:height .45s}#lbt{top:-60px}#lbb{bottom:-60px}
body.cine #lbt,body.cine #lbb{height:calc(8vh + 60px)}
.rb,#jb,#hb,#qp{transition:opacity .3s}
body.cine #jb,body.cine #hb,body.cine .rb,body.cine #qp,body.cine #tlk{opacity:0;pointer-events:none}
#lk{position:fixed;left:0;top:0;width:56px;height:56px;pointer-events:none;z-index:2;display:none}
#lk i{position:absolute;inset:0;animation:rr 3s linear infinite;--k:#ff4a3a;background:linear-gradient(var(--k),var(--k)) 0 0/14px 3px no-repeat,linear-gradient(var(--k),var(--k)) 0 0/3px 14px no-repeat,linear-gradient(var(--k),var(--k)) 100% 0/14px 3px no-repeat,linear-gradient(var(--k),var(--k)) 100% 0/3px 14px no-repeat,linear-gradient(var(--k),var(--k)) 0 100%/14px 3px no-repeat,linear-gradient(var(--k),var(--k)) 0 100%/3px 14px no-repeat,linear-gradient(var(--k),var(--k)) 100% 100%/14px 3px no-repeat,linear-gradient(var(--k),var(--k)) 100% 100%/3px 14px no-repeat;filter:drop-shadow(0 0 2px #000)}
#lk.man:after{content:'';position:absolute;left:50%;top:50%;width:7px;height:7px;margin:-3.5px;border-radius:50%;background:#ff4a3a;box-shadow:0 0 8px #ff4a3a}
#lk.soft{opacity:.7}#lk.soft i{--k:#ffffff;animation-duration:7s}
#hpb.psn i{background:linear-gradient(#8aff6a,#2a9a20 55%,#1a6010)}
#bph{font-style:normal;color:#ff8a5a}
#boss .bt{font-size:12px;white-space:nowrap}#boss{width:min(440px,34vw)}
.lb.neu{color:#ffe08a}
#ts .ck.nw{background:radial-gradient(#ffd34a,#b8861c);border-color:#fff1b0}
/* ===== V10: crepúsculo dourado, inventário ===== */
#mn h1{background:linear-gradient(180deg,#fff6c8 0%,#ffd060 42%,#ff8a3a 78%,#c0402a 100%);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;filter:drop-shadow(0 4px 0 #4a1a2a) drop-shadow(0 0 22px rgba(255,140,60,.55))}
#mn .sub{color:#ffd8c0}
#mn button{background:linear-gradient(#6a3a4a,#2a1420);box-shadow:0 4px 14px rgba(0,0,0,.6),inset 0 0 0 1px #000,inset 0 1px 0 rgba(255,220,150,.35)}
#bag{right:calc(var(--mm) + 16px);top:10px;width:clamp(40px,12vh,52px);height:clamp(40px,12vh,52px)}
#bag.nw,.sl.nw{animation:tp 1.2s ease-in-out infinite}
body.invo #jb,body.invo #hb,body.invo .rb,body.invo #qp,body.invo #mw,body.invo #rg,body.invo #pl,body.invo #tlk,body.invo #boss,body.invo .lb,body.invo #lk{opacity:0!important;pointer-events:none!important}
:root{--es:clamp(40px,11.5vh,58px);--ivw:min(560px,57vw)}
#inv{position:fixed;inset:0;z-index:6;display:none;touch-action:none;background:radial-gradient(ellipse 34% 80% at 22% 55%,transparent 50%,rgba(12,4,18,.6) 100%),linear-gradient(90deg,transparent 0,transparent 38%,rgba(14,6,20,.6) 62%),radial-gradient(ellipse at 22% 62%,rgba(255,170,90,.14),transparent 50%)}
#inv.on{display:block;animation:ivf .35s ease-out}
@keyframes ivf{from{opacity:0}}
#ivP{position:absolute;right:max(10px,env(safe-area-inset-right,0px));top:10px;bottom:10px;width:var(--ivw);display:flex;flex-direction:column;padding:9px 12px 10px;gap:8px;animation:ivs .45s cubic-bezier(.2,.9,.3,1)}
@keyframes ivs{from{transform:translateX(50px);opacity:0}}
.ivh{display:flex;align-items:center;gap:10px}.ivh .ttl{font-size:17px;flex:1}
#ivg{font:700 13px Georgia;color:#ffe08a;text-shadow:0 1px 2px #000}
#ivx{width:32px;height:32px;border-radius:50%;border:2px solid var(--g);background:radial-gradient(#4a3020,#140c08);color:#ffe08a;font:700 15px Georgia;padding:0;cursor:pointer}

.is{aspect-ratio:1;position:relative;border:2px solid #6a4a28;border-radius:6px;background:radial-gradient(circle at 50% 36%,#3e2a26,#120a0c 75%);box-shadow:inset 0 0 0 1px #000,inset 0 0 12px rgba(0,0,0,.8);display:flex;align-items:center;justify-content:center;font-size:clamp(17px,4.6vh,28px);cursor:pointer;transition:transform .12s,box-shadow .2s}

.eqc .is{width:var(--es);font-size:calc(var(--es)*.5)}

#ivN,#ivS{position:absolute;left:0;width:calc(100vw - var(--ivw) - 20px);text-align:center;pointer-events:none}
